spring.application.name=database-inspector
spring.main.banner-mode=off

# Conexión (se puede sobrescribir con variables de entorno DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/ucsajava}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Esquema a inspeccionar (vacío = todos los esquemas)
inspector.schema=${DB_SCHEMA:public}
inspector.console.enabled=true

logging.level.root=WARN
