# Perfil para correr los tests (incluida la prueba de estrés) contra PostgreSQL real.
# Requiere haber cargado db/schema.sql. Uso: mvn test -Dspring.profiles.active=pg
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/ucsajava}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${POOL_SIZE:10}
spring.sql.init.mode=never
