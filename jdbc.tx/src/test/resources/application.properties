# Tests: H2 en memoria con modo PostgreSQL (no requiere un servidor corriendo)
spring.datasource.url=jdbc:h2:mem:inspector;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.main.banner-mode=off

inspector.schema=public
inspector.console.enabled=false
logging.level.root=WARN
